; MegaShop application PHP settings
memory_limit = 512M

; Product / banner uploads
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 30

max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

date.timezone = Asia/Tehran

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

realpath_cache_size = 4096K
realpath_cache_ttl = 600
