[www]
; Keep Docker/Compose environment variables visible to PHP (env()).
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no

php_admin_flag[log_errors] = on
